name: Citation check

# Reusable workflow. Fails when CITATION.cff disagrees with the release:
#   - `version` must equal the version in the manifest.
#   - `date-released` must equal the UTC date the registry (crates.io, or PyPI
#     for Python-only projects) published that version, or the day before it.
#     Releases are dated in US Eastern time, which is up to one day behind UTC.
#     While the version is not yet published (a release PR or branch), the date
#     must be a valid date, not in the future, and not more than one day before
#     the newest published version.
#
# Caller for a crate (the manifest defaults to Cargo.toml):
#   jobs:
#     citation:
#       uses: Sigilweaver/.github/.github/workflows/citation-check.yml@main
#       with:
#         crate: opentfraw
#
# Caller for a PyPI-only project:
#   with:
#     pypi: openyxdb
#     manifest: pyproject.toml

on:
  workflow_call:
    inputs:
      crate:
        description: "crates.io crate name whose release date is checked (set this or pypi)"
        required: false
        type: string
        default: ""
      pypi:
        description: "PyPI project name whose release date is checked (set this or crate)"
        required: false
        type: string
        default: ""
      manifest:
        description: "Manifest holding the version (Cargo.toml workspace.package or package, or pyproject.toml project)"
        required: false
        type: string
        default: Cargo.toml
      cff:
        description: "Path to the citation file"
        required: false
        type: string
        default: CITATION.cff

permissions:
  contents: read

jobs:
  citation:
    name: CITATION.cff matches release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check CITATION.cff
        env:
          CRATE: ${{ inputs.crate }}
          PYPI: ${{ inputs.pypi }}
          MANIFEST: ${{ inputs.manifest }}
          CFF: ${{ inputs.cff }}
        run: |
          python3 - <<'PY'
          import datetime, http.client, json, os, re, sys, time, tomllib, urllib.error, urllib.request

          crate = os.environ["CRATE"]
          pypi = os.environ["PYPI"]
          if bool(crate) == bool(pypi):
              sys.exit("::error::set exactly one of the `crate` and `pypi` inputs of the workflow call")
          name = crate or pypi
          registry = "crates.io" if crate else "PyPI"
          manifest = os.environ["MANIFEST"]
          cff = os.environ["CFF"]
          failures = []


          def fail(path, field, msg):
              print(f"::error file={path},title={field}::{msg}")
              failures.append(msg)


          with open(manifest, "rb") as f:
              data = tomllib.load(f)
          version = (
              data.get("workspace", {}).get("package", {}).get("version")
              or data.get("package", {}).get("version")
              or data.get("project", {}).get("version")
          )
          if not isinstance(version, str):
              sys.exit(f"::error file={manifest}::no literal version found in {manifest}")

          text = open(cff, encoding="utf-8").read()


          def field(name):
              m = re.search(rf'^{name}:[ \t]*["\']?([^"\'\s#]+)', text, re.M)
              return m.group(1) if m else None


          cff_version = field("version")
          cff_date = field("date-released")

          if cff_version != version:
              fail(cff, "version", f"{cff}: `version` is {cff_version or 'missing'} but {manifest} is {version}. Set `version: \"{version}\"`.")

          published = None  # {version: UTC date string}
          last_error = None
          for attempt in range(3):
              try:
                  url = (
                      f"https://crates.io/api/v1/crates/{name}"
                      if crate
                      else f"https://pypi.org/pypi/{name}/json"
                  )
                  req = urllib.request.Request(url, headers={"User-Agent": "sigilweaver-citation-check"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = json.load(r)
                  if crate:
                      published = {v["num"]: v["created_at"][:10] for v in body["versions"]}
                  else:
                      published = {
                          ver: min(f["upload_time_iso_8601"][:10] for f in files)
                          for ver, files in body["releases"].items()
                          if files
                      }
                  break
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      sys.exit(f"::error::{name!r} not found on {registry}; fix the `crate` or `pypi` input of the workflow call (a first release has no registry entry yet and needs the check added after it is published)")
                  last_error = f"HTTP {e.code}"
              except (urllib.error.URLError, OSError, http.client.HTTPException, ValueError, KeyError, TypeError) as e:
                  last_error = repr(e)
              if attempt < 2:
                  time.sleep(5 * (attempt + 1))

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if published is None:
              print(f"::warning::{registry} unreachable ({last_error}); date-released not checked for {name} {version}")
          elif cff_date is None or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", cff_date):
              want = published.get(version, today)
              fail(cff, "date-released", f"{cff}: `date-released` is missing or not YYYY-MM-DD. Set `date-released: \"{want}\"`.")
          elif version in published:
              day = datetime.date.fromisoformat(published[version])
              ok_dates = {day.isoformat(), (day - datetime.timedelta(days=1)).isoformat()}
              if cff_date not in ok_dates:
                  fail(cff, "date-released", f"{cff}: `date-released` is {cff_date} but {name} {version} was published on {registry} on {day} (UTC). Set `date-released: \"{day}\"` (the day before, {day - datetime.timedelta(days=1)}, is also accepted for the US Eastern date).")
          else:
              newest = max(published.values(), default=None)
              earliest = (
                  (datetime.date.fromisoformat(newest) - datetime.timedelta(days=1)).isoformat()
                  if newest
                  else None
              )
              try:
                  datetime.date.fromisoformat(cff_date)
              except ValueError:
                  fail(cff, "date-released", f"{cff}: `date-released` {cff_date} is not a real date.")
              else:
                  if cff_date > today:
                      fail(cff, "date-released", f"{cff}: `date-released` {cff_date} is in the future (UTC today is {today}). {version} is not published yet; use the release date.")
                  elif earliest and cff_date < earliest:
                      fail(cff, "date-released", f"{cff}: `date-released` {cff_date} is more than a day before the newest published {name} release ({newest}). {version} is not published yet; use the release date.")

          if failures:
              sys.exit(1)
          if published is None:
              status = "date not checked"
          elif version in published:
              status = "published " + published[version]
          else:
              status = "unpublished"
          print(f"ok: {cff} version {version}, date-released {cff_date} ({status})")
          PY
